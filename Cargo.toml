[workspace]
resolver = "3"
members = [
    "crates/tapd-client",
    "crates/tapd-domain-demo",
    "crates/tapd-cli",
    # Local-only domain crate; ignored by Git. Uncomment for private builds.
    # "crates/tapd-domain-km",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["tapd-cli contributors"]
license = "MIT"
repository = "https://github.com/1998y12/tapd-cli"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
hex = "0.4"
http = "1.3"
keyring = "4.1"
mime_guess = "2.0"
pulldown-cmark = "0.13"
reqwest = { version = "0.12", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "stream",
] }
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "macros", "rt-multi-thread", "signal", "time"] }
toml = "0.9"
url = "2.5"
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_arguments = "allow"
